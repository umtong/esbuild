name: Validate tsconfig package imports
on:
  push:
    branches: ['ci/tsconfig-package-imports']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26
        with:
          persist-credentials: false
      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495
        with:
          go-version: '1.26.5'
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610
        with:
          node-version: '18'
      - name: Format and record the tested source
        run: |
          gofmt -w internal/resolver/resolver.go internal/bundler_tests/bundler_tsconfig_imports_test.go
          git diff -- internal/resolver/resolver.go internal/bundler_tests/bundler_tsconfig_imports_test.go
          git hash-object internal/resolver/resolver.go internal/bundler_tests/bundler_tsconfig_imports_test.go internal/bundler_tests/snapshots/snapshots_tsconfig.txt
      - name: Prove the regression on the unchanged resolver
        run: |
          git fetch --no-tags --depth=1 origin f6058f8364fe7ab91ca57a83e02577ed74c9cae4
          cp internal/resolver/resolver.go "$RUNNER_TEMP/fixed-resolver.go"
          git show f6058f8364fe7ab91ca57a83e02577ed74c9cae4:internal/resolver/resolver.go > internal/resolver/resolver.go
          set +e
          go test -json -count=1 ./internal/bundler_tests > "$RUNNER_TEMP/baseline.jsonl" 2>&1
          baseline_status=$?
          set -e
          cp "$RUNNER_TEMP/fixed-resolver.go" internal/resolver/resolver.go
          if [ "$baseline_status" -eq 0 ]; then
            echo "The unchanged resolver unexpectedly passed all new regressions"
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync(process.env.RUNNER_TEMP + '/baseline.jsonl', 'utf8');
          const events = text.split('\n').flatMap(line => {
            try { return [JSON.parse(line)]; } catch { return []; }
          });
          const roots = [
            'TestTsconfigExtendsWithImports',
            ...['require', 'node', 'types', 'default'].map(x => 'TestTsconfigExtendsWithImportsConditions/' + x),
            'TestTsconfigExtendsWithImportsPatternAndArray',
            'TestTsconfigExtendsWithImportsNearestPackage',
            'TestTsconfigExtendsWithImportsPackageTarget',
            'TestTsconfigExtendsWithImportsYarnPnP',
            'TestTsconfigExtendsWithImportsAcrossNodeModules',
            'TestTsconfigExtendsWithImportsCycle',
          ];
          const expected = new Set(roots.flatMap(x => [x + '/Unix', x + '/Windows']));
          const failures = events.filter(x => x.Action === 'fail' && x.Test).map(x => x.Test);
          const leaves = new Set(failures.filter(x => /\/(Unix|Windows)$/.test(x)));
          const unexpected = failures.filter(x => ![...expected].some(y => y === x || y.startsWith(x + '/')));
          const controls = new Set(events.filter(x => x.Action === 'pass' && /^TestTsconfigExtendsWithImportsFailure\/.*\/(Unix|Windows)$/.test(x.Test || '')).map(x => x.Test));
          if (leaves.size !== expected.size || [...expected].some(x => !leaves.has(x)) || unexpected.length || controls.size !== 24 || /No test found for snapshot|No snapshot saved/.test(text)) {
            console.log(text);
            throw new Error(JSON.stringify({ expectedFailures: [...expected], actualFailures: [...leaves], unexpected, passingControls: controls.size }));
          }
          console.log('Baseline: ' + leaves.size + ' expected failing platform cases; ' + controls.size + ' passing rejection controls.');
          for (const name of [...leaves].sort()) console.log('EXPECTED FAILURE: ' + name);
          NODE
      - name: Run Go tests with the fix and race detector
        run: go test -race -count=1 ./cmd/... ./internal/... ./pkg/...
      - name: Run Go vet
        run: go vet ./cmd/... ./internal/... ./pkg/...
      - name: Install JavaScript test dependencies
        run: npm ci --prefix scripts
      - name: Run JavaScript API tests
        run: node scripts/js-api-tests.js
      - name: Run end-to-end tests
        run: node scripts/end-to-end-tests.js
      - name: Check whitespace
        run: git diff --check
